[package]
name = "boxpigma"
version = "1.4.0"
edition = "2024"
description = "A netease cloud music client (GBLMX fork)"
repository = "https://github.com/GBLMX/pigma"
license = "Apache-2.0"
authors = ["akirco <earlfx@163.com>", "GBLMX <GBLMX@users.noreply.github.com>"]

[workspace]
# First-party crates live in one workspace so a single lockfile resolves them and
# `cargo test/clippy --workspace` actually covers them (see .github/workflows/ci.yml).
# `crates/y7dl` is a third-party submodule by another author, so it stays independent.
members = ["crates/ncm-api", "crates/sonar"]
exclude = ["crates/y7dl"]
resolver = "3"

# Versions shared by more than one crate. Members pull these in with
# `{ workspace = true }` and may add features; this keeps one version of each
# dependency in the lockfile instead of drifting per crate (rustls used to be
# specified as 0.23, 0.23.32 and 0.23.43 in three different manifests).
[workspace.dependencies]
base64 = "0.23.1"
log = "0.4.33"
md-5 = "0.11.0"
rand = "0.10.2"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
time = "0.3.55"
tokio = { version = "1.53.1", features = ["rt", "sync", "time"] }
url = "2.5.8"

[dependencies]
base64 = { workspace = true }
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
color-eyre = "0.6.5"
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "7.0.0"
futures = { version = "0.3.33", default-features = false, features = ["async-await", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
lofty = "0.25.0"
log = { workspace = true, features = ["serde", "std"] }
ncm-api = { path = "crates/ncm-api" }
palette = "0.7.7"
qrcode = "0.14.1"
rand = "0.10.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29", "layout-cache", "serde"] }
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
reqwest = { workspace = true }
# rodio = { version = "0.22.2", default-features = false, features = ["flac", "mp3", "mp4", "playback", "vorbis", "wav"] }
rodio = { version = "0.22.2", default-features = false, features = ["playback", "symphonia-aac", "symphonia-flac", "symphonia-isomp4", "symphonia-mp3", "symphonia-vorbis", "symphonia-wav"] }
rustls = { workspace = true }
serde = { workspace = true, features = ["rc"] }
serde_json = { workspace = true }
sonar = { path = "crates/sonar" }
stream-download = { version = "0.24.4", default-features = false, features = ["async-read", "reqwest", "temp-storage"] }
thiserror = { workspace = true }
time = { workspace = true, features = ["formatting", "local-offset", "macros"] }
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "signal"] }
toml_edit = { version = "0.25.13", features = ["serde"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "local-time", "tracing-log"] }
unicode-width = "0.2.2"
url = { workspace = true }
# dhat = "0.3.3"

[dev-dependencies]
rustls = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `SIGPIPE` handling (src/cli.rs) is a Unix concern, not a Linux one: Rust ignores the signal on
# every Unix, so the CLI restores the default everywhere it exists.
libc = "0.2.189"

[target.'cfg(windows)'.dependencies]
# The console's background colour (`GetConsoleScreenBufferInfoEx`, src/utils/terminal.rs):
# Windows has no `/dev/tty`, and ConPTY does not answer the OSC 11 query the Unix side uses.
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
opt-level = 3
# opt-level = "s"
strip = true
lto = true
panic = "abort"
codegen-units = 1

# [features]
# default = ["vorbis"]
# vorbis = ["rodio/vorbis"]

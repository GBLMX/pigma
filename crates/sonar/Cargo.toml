[package]
name = "sonar"
version = "0.1.0"
edition = "2024"
description = "A library for searching audios from youtube,bilibili and other platforms.(no cookies)"
license = "MIT"

[dependencies]
async-trait = "0.1.92"
base64 = { workspace = true }
futures = "0.3.33"
log = { workspace = true }
md-5 = { workspace = true }
once_cell = "1.21.4"
regex = "1.13.1"
reqwest = { workspace = true, features = ["brotli", "deflate", "gzip", "json", "query"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# chrono = { version = "0.4.45", features = ["serde"] }
time = { workspace = true, features = ["local-offset"] }
tokio = { workspace = true }
url = { workspace = true }
urlencoding = "2.1"
y7dl = { path = "../y7dl", default-features = false }

[dev-dependencies]
rustls = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: false
          - target: x86_64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            use-cross: false
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            use-cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use-cross: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y lld clang pkg-config libasound2-dev

      - name: Set up aarch64 cross linker (gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu' && !matrix.use-cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "RUSTFLAGS=-C linker=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Setup Cargo Env (aarch64 gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p .cargo
          cat <<EOF >> .cargo/config.toml
          [env]
          PKG_CONFIG_ALLOW_CROSS = "1"
          PKG_CONFIG_PATH = "/usr/lib/aarch64-linux-gnu/pkgconfig"
          EOF

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use-cross
        run: |
          RUSTFLAGS="" cross build --locked --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use-cross }}
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czvf ../../../boxpigma-${{ matrix.target }}.tar.gz boxpigma
          cd -

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../boxpigma-${{ matrix.target }}.zip boxpigma.exe
          cd ..

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: boxpigma-${{ matrix.target }}
          path: |
            boxpigma-${{ matrix.target }}.tar.gz
            boxpigma-${{ matrix.target }}.zip

  release:
    name: publish release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          git-cliff --latest --tag "$VERSION" -o release-notes.md

      - name: Checksums
        # One file the installer scripts can verify against, and the answer to "did my
        # download arrive intact" without asking anyone to copy a hash out of the release
        # page. Names are bare (the assets sit at the release root), sorted so the file
        # itself is reproducible.
        run: |
          cd artifacts
          find . -type f \( -name 'boxpigma-*.tar.gz' -o -name 'boxpigma-*.zip' \) -exec sha256sum {} + \
            | sed -E 's|^([0-9a-f]{64})  \./[^/]+/|\1  |' \
            | sort -k2 \
            > SHA256SUMS
          cat SHA256SUMS

      - name: Upload release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            artifacts/SHA256SUMS
            artifacts/boxpigma-*/boxpigma-*
          body_path: release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  homebrew-tap:
    name: Update Homebrew tap
    needs: release
    # Upstream-only: the tap lives in akirco/homebrew-pigma and the job needs a token we
    # do not have, so it is skipped when this workflow runs in a fork.
    if: startsWith(github.ref, 'refs/tags/') && github.repository == 'akirco/pigma' # 只有在推送 tag 发布时才更新 tap
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tap repository
        uses: actions/checkout@v7
        with:
          repository: akirco/homebrew-pigma
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap

      - name: Update formula
        run: ./tap/update.sh "${GITHUB_REF#refs/tags/}"
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Commit and push
        run: |
          cd tap
          git config user.name 'GitHub Actions'
          git config user.email 'actions@github.com'
          git add Formula/pigma.rb
          if git diff --cached --quiet; then
            echo "No formula changes"
          else
            git commit -m "chore: update boxpigma to ${GITHUB_REF#refs/tags/}"
            git push
          fi
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}


name: CI

# Least privilege: the workflows only read the repository. (The release workflow asks for the
# write it needs on its own.)
permissions:
  contents: read

on:
  pull_request:
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
  push:
    branches:
      - main
      - master
      - develop
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'

env:
  CARGO_TERM_COLOR: always

# A superseded push stops costing runner time: the newest commit on a branch is the only one
# whose result anyone reads.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  skip-check:
    name: skip release commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1
      - name: Check commit message
        id: check
        run: |
          msg="$(git log -1 --format='%s')"
          if [[ "$msg" == release* ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
  fmt:
    name: fmt
    needs: skip-check
    if: needs.skip-check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt
      - name: check formatting
        run: cargo +nightly fmt -- --check
  clippy:
    name: clippy
    needs: skip-check
    if: needs.skip-check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      # Before the build, not after it: a cache step that runs last restores nothing and the
      # next run compiles the whole workspace again.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: Run clippy action
        uses: clechasseur/rs-clippy-check@v5
        with:
          # Cover the workspace members (`crates/ncm-api`) as well:
          # a package-only clippy run never looked at them.
          args: --workspace --all-targets
  build-aarch64:
    name: build linux/aarch64
    needs: skip-check
    if: needs.skip-check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Cargo Env
        run: |
          mkdir -p .cargo
          cat <<EOF >> .cargo/config.toml
          [env]
          PKG_CONFIG_ALLOW_CROSS = "1"
          PKG_CONFIG_PATH = "/usr/lib/aarch64-linux-gnu/pkgconfig"
          EOF

      # Before the build, so it can restore what the last run compiled.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          # Cross builds write under `target/<triple>`, which the action does not key on.
          key: aarch64-unknown-linux-gnu
      - name: Build for aarch64-unknown-linux-gnu
        uses: houseabsolute/actions-rust-cross@v1
        with:
          target: aarch64-unknown-linux-gnu
          command: build
          args: '--locked'
  test:
    needs: skip-check
    if: needs.skip-check.outputs.skip == 'false'
    runs-on: ${{ matrix.os }}
    # A hang must not burn the runner budget; the slowest job here is a cold build.
    timeout-minutes: 60
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libasound2-dev
      # Before the test run: this is what keeps a three-platform matrix from compiling the
      # whole workspace from scratch every time. The key is per-OS because the caches are.
      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo test --locked
        # `--workspace` also runs the tests of the `crates/*` members, which a
        # package-only invocation silently skipped.
        run: cargo test --locked --workspace --all-features
